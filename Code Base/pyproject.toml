[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parksim"
version = "0.1.0"
description = "Simulation environment for the ELEC 491 autonomous parking & summoning vehicle"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
parksim = "parksim.__main__:main"

[tool.setuptools.packages.find]
include = ["parksim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
parksim = ["ui/index.html"]
